# Despliegue de PRODUCCIÓN.
# IMPORTANTE: la interpolación de ${VARIABLES} NO lee env_file; se toma de .env
# o de --env-file. Levantar con:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# "name" fija el proyecto de Compose (ver docker-compose.yml para el motivo:
# sin esto, dos carpetas con el mismo nombre pueden colisionar y Compose puede
# recrear/destruir contenedores de un proyecto ajeno).
name: petrogassa-landing-prod
services:
  # Backend de NestJS (producción)
  backend:
    container_name: ${PROJECT_NAME:-petrogassa-landing}-backend
    build:
      context: .
      target: production
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:${HOST_PORT:-3000}:${PORT:-3000}'
    env_file:
      - .env.prod
    volumes:
      # Almacenamiento de archivos: las imágenes que se suben desde el panel.
      # Son contenido real del sitio, así que esta carpeta va en las copias de
      # seguridad junto con la base.
      #
      # Por defecto cae en ../data/storage, al lado del proyecto y FUERA de
      # cualquier docroot. HOST_STORAGE_PATH solo hace falta para llevarla a
      # otro lado —otro disco, un montaje de red— y entonces tiene que ser una
      # ruta absoluta.
      #
      # IMPORTANTE: el contenedor corre como usuario NO root, con UID 1000, así
      # que esa carpeta del host tiene que dejarlo escribir. Conviene crearla a
      # mano ANTES del primer arranque: si la crea Docker queda de root y las
      # subidas de imágenes fallan sin que nadie lo note hasta probarlas.
      #
      # El destino va FIJO y no interpolado: Docker exige una ruta absoluta, y
      # STORAGE_PATH admite una relativa (el .env.prod trae `./storage`, que
      # Node resuelve bien desde el WORKDIR /app pero rompe el mount con
      # "mount path must be absolute" al crear el contenedor, o sea DESPUÉS de
      # que --build ya construyó la imagen). /app/storage es exactamente donde
      # `./storage` resuelve adentro, así que el valor del .env no cambia nada.
      - ${HOST_STORAGE_PATH:-../data/storage}:/app/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    # Rotación de logs. Docker guarda la salida de cada contenedor en un JSON
    # que por defecto CRECE SIN LÍMITE. En un servidor que va a estar años
    # andando eso termina llenando el disco, y este VPS aloja otros seis sitios:
    # un disco lleno se los lleva puestos a todos. Tope de 30 MB por contenedor.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        ['CMD', 'wget', '-qO-', 'http://127.0.0.1:${PORT:-3000}/api']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Frontend (React + Vite), servido por su propio nginx dentro del contenedor.
  #
  # El contexto de build es la carpeta hermana ../frontend, así que ambos
  # proyectos tienen que estar uno al lado del otro en el servidor.
  #
  # No depende del backend para arrancar: sirve archivos estáticos. Sí lo
  # necesita al CONSTRUIR, y solo para las vistas previas al compartir enlaces
  # (ver VITE_API_URL abajo).
  frontend:
    container_name: ${PROJECT_NAME:-petrogassa-landing}-frontend
    build:
      context: ../frontend
      args:
        # Vite incrusta esta URL DENTRO del JavaScript al compilar: es una
        # variable de BUILD, no de runtime. Cambiarla exige reconstruir la
        # imagen, no alcanza con reiniciar el contenedor.
        #
        # El mismo valor lo usa scripts/prerender.mjs para pedirle al backend
        # los servicios y las novedades, y escribir las etiquetas de vista
        # previa de LinkedIn y WhatsApp. Si la API no responde durante el build,
        # avisa y sigue: el sitio queda bien, solo sin esas vistas previas.
        VITE_API_URL: ${VITE_API_URL:-https://petrogassa.com/api}
    restart: unless-stopped
    init: true
    # Solo loopback: el nginx del host es el único que le habla.
    ports:
      - '127.0.0.1:${FRONTEND_HOST_PORT:-3101}:80'
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Base de datos PostgreSQL (producción)
  db:
    container_name: ${PROJECT_NAME:-petrogassa-landing}-db
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    # Sin 'ports': la DB solo es accesible por la red interna del compose.
    # Para depurar puntualmente, descomentar (queda atado a loopback):
    # ports:
    #   - '127.0.0.1:${DATABASE_HOST_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      # Bind mount para persistencia y backup fácil
      - ../data/postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

networks:
  app-network:
    driver: bridge
    name: ${PROJECT_NAME:-petrogassa-landing}-network
