                    description: URL absoluta pública del certificado en PDF (null si no se cargó). El sitio muestra "Ver / Descargar certificado" cuando no es null.
                sortOrder: { type: integer }
                deletedAt: { type: string, format: date-time, nullable: true, description: 'En la papelera si no es null' }

        CreateCertificationDto:
            type: object
            required: [title, subtitle, description]
            properties:
                title: { type: string, maxLength: 120 }
                subtitle: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 2000 }
                isFeatured: { type: boolean }
                logoImage: { type: string, description: 'Key de media (media/AAAA/MM/uuid.ext). Se acepta también la URL absoluta que devuelve el GET: se normaliza a key. Cualquier otro valor da 400.' }
                certificatePdf: { type: string, description: 'Key de media (media/AAAA/MM/uuid.ext). Se acepta también la URL absoluta que devuelve el GET: se normaliza a key. Cualquier otro valor da 400.' }
