                sortOrder: { type: integer }
                isActive: { type: boolean }
                deletedAt: { type: string, format: date-time, nullable: true, description: 'En la papelera si no es null' }

        CreateClientDto:
            type: object
            required: [name, logoImage]
            properties:
                name: { type: string, maxLength: 120 }
                logoImage: { type: string, description: 'Key de media (media/AAAA/MM/uuid.ext). Se acepta también la URL absoluta que devuelve el GET: se normaliza a key. Cualquier otro valor da 400.' }
                sortOrder: { type: integer }
                isActive: { type: boolean }

        NewsPostEntity:
            type: object
            properties:
                id: { type: string, format: uuid }
                title: { type: string }
                slug: { type: string }
                category: { type: string, enum: [novedades, prensa] }
                publishedAt: { type: string, format: date-time, nullable: true }
                coverImage: { type: string, nullable: true, description: URL absoluta }
                excerpt: { type: string }
                body: { type: string }
                isFeatured: { type: boolean, description: 'ÚNICA: a lo sumo una nota destacada a la vez (lo garantiza el backend)' }
                isPublished: { type: boolean }
                source: { type: string, enum: [manual, linkedin], description: Origen de la nota }
                externalUrl: { type: string, nullable: true, description: URL del post original en LinkedIn (si fue importada) }
                deletedAt: { type: string, format: date-time, nullable: true, description: 'En la papelera si no es null' }

        CreateNewsPostDto:
            type: object
            required: [title, category, excerpt, body]
            properties:
                title: { type: string, maxLength: 200 }
                slug: { type: string, maxLength: 220, description: 'Opcional; "admin" está reservado. Al crear: se genera del título. Al editar: si no se envía SE CONSERVA (cambiar el título no cambia la URL)' }
                category: { type: string, enum: [novedades, prensa] }
                publishedAt: { type: string, format: date-time, description: Si falta al publicar, se usa la fecha actual }
                coverImage: { type: string, description: 'Key de media (media/AAAA/MM/uuid.ext). Se acepta también la URL absoluta que devuelve el GET: se normaliza a key. Cualquier otro valor da 400.' }
                excerpt: { type: string, maxLength: 500 }
                body: { type: string }
                isFeatured: { type: boolean, description: 'true des-marca automáticamente la destacada anterior (atómico; una sola destacada). false siempre es válido (cero destacadas permitido)' }
                isPublished: { type: boolean, description: false = borrador }
                externalUrl: { type: string }

        LinkedInImportEntity:
            type: object
            description: Candidato de la bandeja de LinkedIn (staging; NO es contenido público).
            properties:
                id: { type: string, format: uuid }
                externalId: { type: string, description: URN del post en LinkedIn }
                status: { type: string, enum: [pending, approved, rejected] }
                externalUrl: { type: string, description: Permalink al post en LinkedIn }
                text: { type: string }
                mediaUrl: { type: string, nullable: true, description: URL de la imagen del post (previsualización) }
                authorName: { type: string, nullable: true }
                postedAt: { type: string, format: date-time, nullable: true }
                newsPostId: { type: string, format: uuid, nullable: true, description: Nota creada al aprobar }
                reviewedAt: { type: string, format: date-time, nullable: true }

        ApproveLinkedInImportDto:
            type: object
            required: [category]
            properties:
                category: { type: string, enum: [novedades, prensa], description: Catalogación (obligatoria) }
                isFeatured: { type: boolean, description: 'true des-marca automáticamente la destacada anterior (una sola destacada)' }
                title: { type: string, maxLength: 200, description: Opcional; si falta se deriva del texto }
                excerpt: { type: string, maxLength: 500, description: Opcional; si falta se deriva del texto }

        DegreeTitleEntity:
            type: object
            properties:
                id: { type: string, format: uuid }
