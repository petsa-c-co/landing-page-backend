            type: object
            required: [name, level]
            properties:
                name: { type: string, maxLength: 150 }
                level:
                    type: string
                    enum: [primario, secundario, secundario_tecnico, terciario, universitario, formacion_profesional]
                isActive: { type: boolean }
                sortOrder: { type: integer }

        CreateContactMessageDto:
            type: object
            required: [name, email, message]
            properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 30 }
                subject: { type: string, maxLength: 150 }
                message: { type: string, minLength: 10, maxLength: 5000 }
                referencia:
                    type: string
                    maxLength: 200
                    description: >-
                        Campo TRAMPA (honeypot). El formulario debe incluirlo
                        oculto (fuera de pantalla, tabindex="-1",
                        autocomplete="off") y dejarlo SIEMPRE vacío: si llega
                        con contenido, el mensaje se descarta en silencio y la
                        respuesta es 201 igual, para no avisarle al bot.

        ChangeLogEntry:
            type: object
            description: Un asiento del registro de cambios. Append-only.
            properties:
                id: { type: string, format: uuid }
                occurredAt: { type: string, format: date-time }
                revision: { type: string, example: '03', description: 'Revisión del sitio bajo la que cayó el cambio. Dos dígitos, sin punto; a los tres dígitos vuelve a 01 y la fecha es lo que desambigua.' }
                entityType: { type: string, example: certificacion }
                entityLabel:
                    type: string
                    example: 'ISO 9001:2015'
                    description: >-
                        Cómo se llamaba el registro CUANDO se lo tocó. Congelado
                        a propósito: si después se renombra o se elimina, el
                        asiento sigue diciendo de qué se trataba.
                action: { type: string, enum: [creacion, modificacion, baja, restauracion, eliminacion] }
                actorLabel:
                    type: string
                    example: 'Nicolás Espinoza <nicolas.espinoza@petrogassa.com>'
                    description: Quién lo hizo. Sobrevive al borrado de esa cuenta.
                details:
                    type: array
                    items:
                        type: object
                        properties:
                            fieldLabel: { type: string, example: Descripción }
                            previousValue: { type: string, nullable: true }
                            newValue: { type: string, nullable: true }
                            summary:
                                type: string
                                nullable: true
                                description: >-
                                    Cuando viene, reemplaza a los valores: pasa
                                    con los campos largos (solo se registra que
                                    cambiaron) y con los archivos.
                            valueKind: { type: string, enum: [texto, booleano, numero, fecha, archivo, lista] }

        ContactMessageEntity:
            type: object
            properties:
                id: { type: string, format: uuid }
                name: { type: string }
                email: { type: string }
                phone: { type: string, nullable: true }
                subject: { type: string, nullable: true }
                message: { type: string }
                status: { type: string, enum: [nueva, leida] }
                createdAt: { type: string, format: date-time }
