openapi: 3.0.0
info:
    title: 'Petrogassa API'
    description: >
        API de autenticación con NestJS (modelo cerrado, sin registro público):
        un admin da de alta usuarios por invitación; cada invitado activa su
        cuenta definiendo nombre, apellido y contraseña. Login con JWT en cookies
        HttpOnly, refresh tokens rotados (hasheados en DB, con detección de
        reutilización) y recuperación de contraseña. Todas las respuestas usan un
        sobre estándar (ver esquemas `SuccessEnvelope` / `ErrorResponse`).
    version: '0.0.1'
servers:
    - url: /api
      description: Servidor local

tags:
    - name: Auth
      description: Autenticación, alta e invitación de usuarios y gestión de sesiones
    - name: Users
      description: Consulta de usuarios (requiere sesión)
    - name: Services
      description: Servicios de la empresa (contenido del sitio)
    - name: Certifications
      description: Certificaciones ISO (contenido del sitio)
    - name: Clients
      description: Clientes mostrados en el index (contenido del sitio)
    - name: News
      description: Novedades y prensa (paginado; co-gestión admin/rrhh)
    - name: Recruitment
      description: >-
        Formulario público de postulación y catálogo de títulos académicos. Las
        postulaciones y los puestos son un puente hacia Gestión Petrogas: este
        backend no las guarda ni almacena el CV, solo los reenvía. El catálogo de
        títulos sí es local y lo administra RRHH.
    - name: Contact
      description: Formulario de contacto y bandeja de mensajes
    - name: Media
      description: Subida de imágenes de contenido al almacenamiento en filesystem
    - name: SiteSettings
      description: Configuración global del sitio (singleton; marca de certificación del footer)
    - name: ChangeLog
      description: >-
        Registro de cambios del sitio (control de documentos ISO). Solo lectura:
        no hay forma de editar ni borrar un asiento.

paths:
    /auth/users:
        post:
            tags: [Auth]
            summary: Invitar (dar de alta) un usuario — solo admin
            description: >
                Crea una cuenta PENDIENTE (solo email + roles) y envía un correo
                con el enlace de activación. El usuario define su nombre, apellido
                y contraseña al activarse. Requiere sesión con rol admin. El admin
                puede asignar el rol `admin`.
            security:
                - cookieAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InviteUserDto'
            responses:
                '201':
                    description: Usuario invitado (pendiente de activación).
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          message:
                                              example: 'Usuario invitado. Se le envió un correo para activar su cuenta.'
                                          data:
                                              $ref: '#/components/schemas/UserEntity'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '409':
                    $ref: '#/components/responses/Conflict'
                '429':
                    $ref: '#/components/responses/TooManyRequests'

    /auth/users/{id}/resend-activation:
        post:
            tags: [Auth]
            summary: Reenviar la invitación de activación — solo admin
            description: >
                Revoca los tokens de activación previos del usuario y envía uno
                nuevo. Útil si el enlace expiró. Requiere sesión con rol admin.
            security:
                - cookieAuth: []
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '201':
                    description: Invitación reenviada.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          message:
                                              example: 'Invitación reenviada correctamente'
                                          data:
                                              nullable: true
                                              example: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/TooManyRequests'

    /auth/activate:
        post:
            tags: [Auth]
            summary: Activar una cuenta invitada
            description: >
                El invitado define nombre, apellido y contraseña con el token
                recibido por correo. Lo invoca la página `/activate` del frontend.
                Al completarse, la cuenta queda activa y verificada.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ActivateAccountDto'
            responses:
                '201':
                    description: Cuenta activada.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          message:
                                              example: 'Cuenta activada correctamente. Ya puedes iniciar sesión.'
                                          data:
                                              nullable: true
                                              example: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/TooManyRequests'

    /auth/login:
        post:
            tags: [Auth]
            summary: Iniciar sesión
            description: >
                Autentica al usuario y establece las cookies `accessToken` (15m,
                Path=/) y `refreshToken` (7d, Path=/api/auth), ambas HttpOnly +
                SameSite=Strict (+ Secure en producción).
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginUserDto'
            responses:
                '201':
                    description: Login exitoso; cookies de sesión establecidas.
                    headers:
                        Set-Cookie:
                            description: Cookies `accessToken` y `refreshToken`.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          message:
                                              example: 'Inicio de sesión exitoso'
                                          data:
                                              $ref: '#/components/schemas/PublicUser'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '429':
                    $ref: '#/components/responses/TooManyRequests'

    /auth/refresh:
        post:
            tags: [Auth]
            summary: Refrescar tokens de sesión
            description: >
                Lee el `refreshToken` de la cookie, lo rota (revoca el anterior)
                y actualiza las cookies. Si se presenta un token ya rotado, se
                interpreta como robo y se revocan TODAS las sesiones del usuario.
            parameters:
                - in: cookie
                  name: refreshToken
                  required: true
                  schema:
                      type: string
            responses:
                '201':
                    description: Sesión renovada; cookies actualizadas.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          message:
                                              example: 'Sesión renovada correctamente'
                                          data:
                                              nullable: true
                                              example: null
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '429':
                    $ref: '#/components/responses/TooManyRequests'

    /auth/logout:
        post:
            tags: [Auth]
            summary: Cerrar sesión
            description: Revoca el `refreshToken` en la DB y elimina las cookies.
            parameters:
                - in: cookie
                  name: refreshToken
                  required: false
                  schema:
                      type: string
            responses:
                '201':
                    description: Sesión cerrada; cookies eliminadas.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          message:
                                              example: 'Sesión cerrada correctamente'
                                          data:
                                              nullable: true
                                              example: null
                '429':
                    $ref: '#/components/responses/TooManyRequests'

    /auth/forgot-password:
        post:
            tags: [Auth]
            summary: Solicitar recuperación de contraseña
            description: >
                Envía un correo de recuperación si la cuenta existe y está activa.
                Por anti-enumeración, la respuesta es idéntica en cualquier caso.
                Límite reforzado: 3 peticiones/min por IP.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ForgotPasswordDto'
            responses:
                '201':
                    description: Petición procesada (respuesta neutra).
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          message:
                                              example: 'Si el correo electrónico está registrado, te enviaremos un correo con instrucciones para restablecer tu contraseña'
                                          data:
                                              nullable: true
                                              example: null
                '429':
                    $ref: '#/components/responses/TooManyRequests'

    /auth/reset-password:
        post:
            tags: [Auth]
            summary: Restablecer contraseña
            description: >
                Define una nueva contraseña validando el token del correo. Al
                completarse, se revocan todas las sesiones activas del usuario.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResetPasswordDto'
            responses:
                '201':
                    description: Contraseña restablecida.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          message:
                                              example: 'Contraseña restablecida correctamente'
                                          data:
                                              nullable: true
                                              example: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/TooManyRequests'

    /sitemap.xml:
        get:
            tags: [SiteSettings]
            summary: Sitemap XML del sitio público (sin autenticación)
            description: >
                ATENCIÓN: esta ruta vive FUERA del prefijo `/api` — se pide en la
                raíz del dominio (`https://petrogassa.com/sitemap.xml`) y es la
                única del backend que no devuelve el sobre estándar
                `{ success, statusCode, message, data }`: responde XML crudo,
                porque los buscadores descartan el archivo si viene envuelto en
                JSON o con otro content-type.

                Contiene las 8 páginas fijas del sitio, un `<url>` por servicio
                activo y uno por nota publicada, cada uno con `<lastmod>` en
                formato AAAA-MM-DD. Solo lista contenido que el sitio público
                sirve: nunca borradores ni elementos en la papelera. El dominio
                sale de la variable de entorno `PUBLIC_SITE_URL`.
            responses:
                '200':
                    description: Sitemap generado.
                    headers:
                        Content-Type:
                            schema: { type: string, example: 'application/xml; charset=utf-8' }
                        Cache-Control:
                            schema: { type: string, example: 'public, max-age=3600' }
                    content:
                        application/xml:
                            schema: { type: string }
                            example: |
                                <?xml version="1.0" encoding="UTF-8"?>
                                <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
                                    <url>
                                        <loc>https://petrogassa.com/</loc>
                                    </url>
                                    <url>
                                        <loc>https://petrogassa.com/servicios/well-testing</loc>
                                        <lastmod>2026-03-14</lastmod>
                                    </url>
                                </urlset>

    /auth/me:
        get:
            tags: [Auth]
            summary: Usuario de la sesión actual (con sus roles)
            description: >
                Devuelve el usuario dueño de la cookie `accessToken`, incluidos
                `roles` y `status`. Es la única forma que tiene el frontend de
                conocer el rol tras recargar la página: las cookies son
                httpOnly y no puede leer el token. La contraseña nunca se
                expone. Responde 401 si la sesión venció o la cuenta fue
                desactivada.
            security:
                - cookieAuth: []
            responses:
                '200': { description: Sesión obtenida. }
                '401': { $ref: '#/components/responses/Unauthorized' }

    /users:
        get:
            tags: [Users]
            summary: Listar usuarios (admin, paginado)
            description: >
                Grilla de administración de cuentas. Cada usuario incluye
                `status` (`pendiente` | `activo` | `desactivado`), derivado de
                `isActive` y de si la persona llegó a definir su contraseña.
                La contraseña nunca se expone.
            security: [{ cookieAuth: [] }]
            parameters:
                - in: query
                  name: search
                  description: Busca en nombre, apellido y email, ignorando mayúsculas y acentos.
                  schema: { type: string, maxLength: 100 }
                - { in: query, name: role, schema: { type: string, enum: [admin, rrhh, user] } }
                - { in: query, name: status, schema: { type: string, enum: [pendiente, activo, desactivado] } }
                - { in: query, name: page, schema: { type: integer } }
                - { in: query, name: limit, schema: { type: integer } }
            responses:
                '200': { description: Usuarios obtenidos. }
                '400': { $ref: '#/components/responses/ValidationError' }
                '401': { $ref: '#/components/responses/Unauthorized' }

    /users/{id}/revoke-sessions:
        post:
            tags: [Users]
            summary: Cerrar todas las sesiones de una cuenta (admin)
            description: >
                Revoca los refresh tokens del usuario e invalida sus access
                tokens ya emitidos, sin darlo de baja: la cuenta sigue activa
                (`status` no cambia) y puede volver a iniciar sesión con su
                contraseña. Pensado para una notebook perdida o una sesión
                abierta en una máquina ajena; para cortar el acceso por completo
                se usa `deactivate`. Un admin no puede cerrar las propias.
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
            responses:
                '201':
                    description: Sesiones cerradas.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: object
                                        properties:
                                            sessionsClosed:
                                                type: integer
                                                description: Cuántas sesiones se cerraron.
                                                example: 2
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409':
                    description: Se intentó cerrar las sesiones propias.

    /users/{id}/deactivate:
        post:
            tags: [Users]
            summary: Quitar el acceso a una cuenta (admin)
            description: >
                Efecto inmediato: las sesiones abiertas dejan de funcionar en el
                siguiente request y se revocan sus refresh tokens. Un admin no
                puede desactivarse a sí mismo.
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
            responses:
                '201': { description: Acceso desactivado. }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409':
                    description: >
                        La cuenta ya no tiene acceso, o se intentó desactivar la
                        propia sesión.

    /users/{id}/reactivate:
        post:
            tags: [Users]
            summary: Devolver el acceso a una cuenta dada de baja (admin)
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
            responses:
                '201': { description: Acceso restablecido. }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409':
                    description: >
                        La cuenta ya está activa, o nunca fue activada por su
                        titular (en ese caso corresponde reenviar la invitación).

    /users/{id}/roles:
        patch:
            tags: [Users]
            summary: Reemplazar los roles de una cuenta (admin)
            description: >
                Reemplaza el conjunto completo de roles; no es una modificación
                parcial. Toma efecto de inmediato, porque los roles se leen de
                la base en cada request. Un admin no puede cambiarse los suyos.
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [roles]
                            properties:
                                roles:
                                    type: array
                                    minItems: 1
                                    items: { type: string, enum: [admin, rrhh, user] }
                            example: { roles: [rrhh] }
            responses:
                '200': { description: Roles actualizados. }
                '400': { $ref: '#/components/responses/ValidationError' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409':
                    description: Se intentó cambiar los roles propios.

    /users/{id}:
        get:
            tags: [Users]
            summary: Obtener un usuario por id
            description: >
                Requiere sesión (cookie `accessToken`). Un usuario solo puede
                consultarse a sí mismo; un admin puede consultar a cualquiera.
            security:
                - cookieAuth: []
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '200':
                    description: Usuario obtenido.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          message:
                                              example: 'Usuario obtenido correctamente'
                                          data:
                                              $ref: '#/components/schemas/UserEntity'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
        delete:
            tags: [Users]
            summary: Eliminar una invitación pendiente (admin)
            description: >
                Único borrado real de usuarios, acotado a cuentas con
                `status = pendiente`: una invitación que nunca se aceptó no
                tiene historia que preservar, y es la salida cuando se invitó a
                una dirección equivocada. Su token de activación se elimina en
                cascada y el email queda libre para reinvitarlo. Las cuentas en
                uso responden 409: esas se dan de baja con `deactivate`.
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
            responses:
                '200': { description: Invitación eliminada. }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409':
                    description: >
                        La cuenta ya fue activada alguna vez (activa o
                        desactivada); no se elimina, se desactiva.


    /services:
        get:
            tags: [Services]
            summary: Listar servicios (público)
            description: Servicios activos con sus items, ordenados. Imágenes como URLs absolutas.
            responses:
                '200':
                    description: Servicios obtenidos.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/ServiceEntity'
        post:
            tags: [Services]
            summary: Crear servicio (admin)
            security: [{ cookieAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateServiceDto'
            responses:
                '201': { description: Servicio creado. }
                '400': { $ref: '#/components/responses/ValidationError' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '409': { $ref: '#/components/responses/UniqueConflict' }

    /services/admin:
        get:
            tags: [Services]
            summary: Listar todos los servicios, incluidos inactivos (admin)
            security: [{ cookieAuth: [] }]
            responses:
                '200': { description: Servicios obtenidos. }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /services/{slug}:
        get:
            tags: [Services]
            summary: Obtener un servicio por slug (público)
            parameters:
                - { in: path, name: slug, required: true, schema: { type: string } }
            responses:
                '200': { description: Servicio obtenido. }
                '404': { $ref: '#/components/responses/NotFound' }

    /services/{id}:
        patch:
            tags: [Services]
            summary: Actualizar servicio (admin; items = reemplazo total)
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateServiceDto'
            responses:
                '200': { description: Servicio actualizado. }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { $ref: '#/components/responses/UniqueConflict' }
        delete:
            tags: [Services]
            summary: Enviar servicio a la papelera (admin, soft delete)
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
            responses:
                '200': { description: Servicio movido a la papelera. }
                '404': { $ref: '#/components/responses/NotFound' }

    /services/admin/trash:
        get:
            tags: [Services]
            summary: Papelera de servicios (admin)
            security: [{ cookieAuth: [] }]
            responses:
                '200':
                    description: Servicios borrados (soft delete), URLs absolutas.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          data: { type: array, items: { $ref: '#/components/schemas/ServiceEntity' } }
                '401': { $ref: '#/components/responses/Unauthorized' }
    /services/{id}/restore:
        post:
            tags: [Services]
            summary: Restaurar un servicio de la papelera (admin)
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
            responses:
                '200': { description: Servicio restaurado. }
                '404': { $ref: '#/components/responses/NotFound' }
                '409':
                    description: >
                        Sin `conflict`: el servicio no está en la papelera. Con
                        `conflict` (inTrash:false): otro servicio activo ya usa ese
                        slug (defensivo — la papelera reserva el slug, así que no
                        debería ocurrir en el flujo normal).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UniqueConflictErrorResponse'
    /services/{id}/permanent:
        delete:
            tags: [Services]
            summary: Eliminar un servicio definitivamente (admin; borra también las imágenes del almacenamiento)
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
            responses:
                '200': { description: Servicio eliminado definitivamente. }
                '404': { $ref: '#/components/responses/NotFound' }
                '409': { description: 'El registro no está en la papelera: hay que enviarlo ahí antes de eliminarlo definitivamente.' }

    /certifications:
        get:
            tags: [Certifications]
            summary: Listar certificaciones (público)
            responses:
                '200':
                    description: Certificaciones obtenidas.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/CertificationEntity'
        post:
            tags: [Certifications]
            summary: Crear certificación (admin)
