                    type: string
                    enum: [primario, secundario, secundario_tecnico, terciario, universitario, formacion_profesional]
                isActive: { type: boolean }
                sortOrder: { type: integer }
                deletedAt: { type: string, format: date-time, nullable: true, description: 'En la papelera si no es null' }

