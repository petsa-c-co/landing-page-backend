    /news/linkedin/sync:
        post:
            tags: [News]
            summary: Sincronizar posteos de LinkedIn a la cola (admin o rrhh)
            description: >-
                Trae los posteos recientes de la página de LinkedIn y agrega los
                nuevos como candidatos pendientes. Con LINKEDIN_FETCH_MODE=stub usa
                posteos de ejemplo; con 'api' llama a la Community Management API real
                (requiere credenciales aprobadas). El dedupe por externalId evita
                reimportar lo ya procesado.
            security: [{ cookieAuth: [] }]
            responses:
                '201':
                    description: Sincronización completada.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  fetched: { type: integer, description: Posteos traídos de la fuente }
                                                  created: { type: integer, description: Nuevos agregados a la cola }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '503': { description: LinkedIn no configurado o sin responder (solo modo 'api'). }

