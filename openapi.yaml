        get:
            tags: [News]
            summary: Cola de curaduría de LinkedIn (admin o rrhh, paginado)
            description: Por defecto lista los candidatos pendientes de aprobación.
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected] } }
                - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
                - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
            responses:
                '200':
                    description: Candidatos, con meta de paginación.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/LinkedInImportEntity'
                                          meta:
                                              $ref: '#/components/schemas/PaginationMeta'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }

    /news/linkedin/imports/{id}/approve:
        post:
            tags: [News]
            summary: Aprobar y publicar un posteo de LinkedIn (admin o rrhh)
            description: >-
                Crea y publica una nota (news_posts) copiando el contenido del posteo,
                descargando la imagen al almacenamiento, y marca el candidato como aprobado. Devuelve
                la nota creada.
            security: [{ cookieAuth: [] }]
            parameters:
                - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ApproveLinkedInImportDto'
            responses:
                '201':
                    description: Nota creada y publicada.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessEnvelope'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/NewsPostEntity'
                '400': { $ref: '#/components/responses/ValidationError' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { $ref: '#/components/responses/NotFound' }
                '409':
                    description: >
                        Único 409 de este endpoint: el candidato ya fue procesado
                        (aprobado o rechazado). Un slug derivado duplicado NO da
                        409: se le agrega sufijo automáticamente (titulo-2,
                        titulo-3...). No trae `conflict`.

