# Entorno de DESARROLLO local.
# Levanta solo la base de datos; la app se corre en el host con `pnpm start:dev`.
# Levantar con:  docker compose --env-file .env.dev up -d
services:
    # Base de datos PostgreSQL (solo para desarrollo local)
    db:
        container_name: ${PROJECT_NAME}-db
        image: postgres:17-alpine
        restart: unless-stopped
        init: true
        # Atado a loopback: accesible solo desde la máquina de desarrollo.
        ports:
            - '127.0.0.1:${DATABASE_HOST_PORT}:5432'
        environment:
            POSTGRES_USER: ${DATABASE_USER}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
            POSTGRES_DB: ${DATABASE_NAME}
        volumes:
            - ./postgres:/var/lib/postgresql/data
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
